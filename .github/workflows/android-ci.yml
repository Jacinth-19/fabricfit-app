name: Android CI/CD

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # JDK 21: Robolectric 4.16 refuses to sandbox SDK 36 on an older JDK, and this
    # module targets API 36. Bytecode still targets 17.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x FabricFit/gradlew

    # TFLite binaries are build inputs, not source (7.5 MB). See FabricFit/docs/MODELS.md.
    - name: Fetch TFLite models
      run: bash tools/models/fetch_tflite_models.sh
      working-directory: FabricFit
      
    # The translation packs are checked in, generated, and easy to drift. This
    # validates key parity, format specifiers and escaping across tw/gaa/ee
    # without needing the Android SDK, so a missing translation fails here
    # instead of shipping as a blank label on a non-English device.
    - name: Validate translation packs
      run: python3 tools/i18n/generate.py
      working-directory: FabricFit

    - name: Run Unit Tests
      run: |
        cd FabricFit
        ./gradlew test --stacktrace

    # Surfaces Kotlin/Javac diagnostics as annotations so failures are readable
    # without downloading multi-MB logs.
    - name: Annotate compile errors
      if: failure()
      run: |
        cd FabricFit
        ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --console=plain -q 2>&1 \
          | grep -E "^e: |error:" | head -40 \
          | while IFS= read -r line; do
              echo "::error title=COMPILE::${line//%/％}"
            done

    - name: Print failing tests
      if: failure()
      run: |
        python3 - <<'PY'
        import pathlib, xml.etree.ElementTree as ET
        for xml in pathlib.Path("FabricFit/app/build/test-results").rglob("*.xml"):
            for tc in ET.parse(xml).iter("testcase"):
                for f in list(tc.findall("failure")) + list(tc.findall("error")):
                    name = f"{tc.attrib.get('classname')}.{tc.attrib.get('name')}"
                    msg = (f.text or "").strip().splitlines()
                    detail = " | ".join(m.strip() for m in msg[:3])
                    print(f"::error title=FAILED TEST::{name} :: {detail[:900]}")
        PY
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: FabricFit/app/build/reports/tests/
        
    - name: Generate Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Tests
        path: FabricFit/app/build/test-results/**/*.xml
        reporter: java-junit
        
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x FabricFit/gradlew

    # TFLite binaries are build inputs, not source (7.5 MB). See FabricFit/docs/MODELS.md.
    - name: Fetch TFLite models
      run: bash tools/models/fetch_tflite_models.sh
      working-directory: FabricFit
      
    - name: Build Debug APK
      run: |
        cd FabricFit
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: FabricFit/app/build/outputs/apk/debug/app-debug.apk
        
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x FabricFit/gradlew

    # TFLite binaries are build inputs, not source (7.5 MB). See FabricFit/docs/MODELS.md.
    - name: Fetch TFLite models
      run: bash tools/models/fetch_tflite_models.sh
      working-directory: FabricFit
      
    - name: Run Lint
      run: |
        cd FabricFit
        ./gradlew lint
        
    - name: Upload Lint Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: FabricFit/app/build/reports/lint-results-*.html
