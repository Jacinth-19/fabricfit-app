name: build

on:
  push:
    # Feature branches are built too, so a branch can be validated (and have its
    # screenshots refreshed) without opening a pull request first.
    branches: [main, "arena/**"]
    tags: ['v*']
  pull_request:
  # Weekly emulator sweep on Linux with KVM acceleration; a schedule keeps
  # device-qa exercised without anyone remembering to click "Run workflow".
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The Android module lives in FabricFit/; every run step starts there.
defaults:
  run:
    working-directory: FabricFit

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # JDK 21, not 17: Robolectric refuses to build a sandbox for SDK 36 on
      # anything older ("Android SDK 36 requires Java 21"), and the module targets
      # API 36. Bytecode still targets 17, so the APK is unaffected.
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The TFLite binaries are build inputs, not source: they are 7.5 MB of weights and
      # are fetched rather than committed. See FabricFit/docs/MODELS.md.
      - name: Fetch TFLite models
        run: bash tools/models/fetch_tflite_models.sh

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The wrapper is committed without the executable bit, so make it runnable.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Store and in-app copy must not advertise a mailbox on a domain we do not own; the
      # privacy policy previously offered support@fabricfit.app, which does not exist.
      # Note the bare path: the job's defaults.run.working-directory is already FabricFit.
      - name: Check store contact addresses
        run: python3 tools/qa/check_store_contacts.py
      # AGP downloads the compileSdk platform itself, but build-tools is not implied by
      # compileSdk: AGP 8.9's default build-tools is 35.0.0, which cannot compile an
      # API 36 target. Pin it here so the runner does not fail on a missing package.
      - name: Install Android 36 build-tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo "No ANDROID_HOME or ANDROID_SDK_ROOT on this runner" >&2
            exit 1
          fi
          build_tools="$sdk_root/build-tools/36.0.0"
          if [ -d "$build_tools" ]; then
            echo "build-tools 36.0.0 already present"
            exit 0
          fi
          sdk_manager=$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk_manager"
          yes | "$sdk_manager" --install 'build-tools;36.0.0' 'platforms;android-36'

      # assembleDebugAndroidTest compiles the instrumented source set, so a
      # package/class rename there is caught without needing an emulator.
      # Robolectric downloads a large android-all jar on first use. GitHub's Maven proxy
      # occasionally fails that fetch, which fails every Robolectric test at once (not just
      # the newest one), so give the download its own retried step.
      - name: Warm the Robolectric android-all cache
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest --tests 'com.fabricfit.app.ui.DeepLinkIntentTest' \
                --console=plain 2>&1 | tee robolectric-warmup.log; then
              echo "Robolectric runtime fetched"
              exit 0
            fi
            if grep -q 'Failed to fetch maven artifact org.robolectric' robolectric-warmup.log; then
              echo "::warning title=Robolectric download flake::attempt $attempt, retrying"
              sleep 15
              continue
            fi
            echo "warm-up failed for another reason; the real test step will report it"
            exit 0
          done
          echo "::warning title=Robolectric download flake::gave up after 3 attempts"
          exit 0

      - name: Unit tests, debug build, instrumented-test compile
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            :app:assembleDebugAndroidTest --console=plain 2>&1 | tee verify-gradle.log

      # Job logs need a login to read; annotations are visible on the public run
      # page, so the reason for a red build is obvious without opening the log.
      - name: Annotate the Gradle failure
        if: failure() && env.HAS_KEY == 'true'
        run: python3 ../tools/qa/gradle_error_annotations.py verify-gradle.log

      # Gradle only prints "There were failing tests"; the names and messages live in
      # the JUnit XML. Annotations are readable without downloading anything.
      - name: Annotate the failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          found = False
          for xml in pathlib.Path("app/build/test-results").rglob("*.xml"):
              for tc in ET.parse(xml).iter("testcase"):
                  for f in list(tc.findall("failure")) + list(tc.findall("error")):
                      found = True
                      name = f"{tc.attrib.get('classname')}.{tc.attrib.get('name')}"
                      lines = [l.strip() for l in (f.text or "").splitlines() if l.strip()]
                      print(f"::error title=FAILED TEST::{name} :: {' | '.join(lines[:4])[:1200]}")
          print("annotated" if found else "no failing test XML found")
          PY

      # Annotations are truncated, so the full error list also goes to the pull
      # request (or the branch's PR), where it can be read line by line.
      - name: Report the failure on the pull request
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number \
               --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request for ${GITHUB_REF_NAME}; skipping comment."
            exit 0
          fi
          {
            echo "### ❌ Gradle: \`verify\` failed on \`${GITHUB_REF_NAME}\`"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            python3 ../tools/qa/gradle_error_annotations.py verify-gradle.log --markdown
          } > /tmp/gradle-failure.md
          # Update the previous failure comment instead of spamming the PR.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
            --jq '[.[] | select(.body | startswith("### ❌ Gradle:"))] | last | .id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@/tmp/gradle-failure.md > /dev/null
          else
            gh pr comment "$pr" --body-file /tmp/gradle-failure.md
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: FabricFit/app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-debug-apk
          path: FabricFit/app/build/outputs/apk/debug/app-debug.apk

  # R8 exists to break code that reflection reaches at runtime, so the minified
  # release build is compiled on every push too — not just at release time.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # JDK 21: AGP 8.9 builds this API 36 module on it; bytecode still targets 17.
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The TFLite binaries are build inputs, not source: they are 7.5 MB of weights and
      # are fetched rather than committed. See FabricFit/docs/MODELS.md.
      - name: Fetch TFLite models
        run: bash tools/models/fetch_tflite_models.sh

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # The upload key is a repository secret, never a checked-in file. If the secrets are
      # absent this job fails here with a readable message instead of producing an unsigned
      # release. FabricFit/tools/release/new_upload_key.sh creates the key and prints the
      # values this step expects.
      # A job-level `if` cannot read `secrets`, so the gate lives in a step and every later
      # step keys off HAS_KEY. Without the secret the job reports success but builds and
      # publishes nothing, and says so with a warning annotation: a skipped release is
      # honest, an *unsigned* release is not, and a permanently red pipeline would hide
      # real regressions behind the noise.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning title=Release skipped::KEYSTORE_BASE64 is not set, so no release artifact was built. Run FabricFit/tools/release/new_upload_key.sh and add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets (see FabricFit/BUILD.md, 'Release signing')."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/upload.keystore
          echo "KEYSTORE_FILE=upload.keystore" >> "$GITHUB_ENV"
          echo "HAS_KEY=true" >> "$GITHUB_ENV"
          echo "Decoded upload keystore ($(stat -c%s app/upload.keystore) bytes)."

      - name: Minified release APK + Play bundle
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain 2>&1 \
            | tee release-gradle.log

      - name: Annotate the Gradle failure
        if: failure() && env.HAS_KEY == 'true'
        run: python3 ../tools/qa/gradle_error_annotations.py release-gradle.log

      - name: Upload release APK
        if: success() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-apk
          path: FabricFit/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play bundle
        if: success() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-aab
          path: FabricFit/app/build/outputs/bundle/release/app-release.aab

      # Artifacts expire and need an Actions login to download, so the release
      # build is also attached to a GitHub Release for one-click install.
      - name: Publish release APK + bundle to GitHub Releases
        if: >-
          success() && env.HAS_KEY == 'true' && (github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' &&
           contains(github.event.head_commit.message, '[release]')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          tag="v${version:-1.0.0}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/fabricfit-${tag}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/fabricfit-${tag}.aab"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            # Pin a newly created tag to the exact revision compiled in this job.
            # Without --target, a manual release from a branch can tag the
            # repository's default branch while publishing branch-built assets.
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "FabricFit ${tag}" \
              --notes "Signed release build produced by GitHub Actions run ${GITHUB_RUN_ID} from commit ${GITHUB_SHA}."
          fi
          echo "Published $tag"

  # Opt-in device QA: run the full instrumented suite on a KVM-accelerated
  # Linux emulator. Fires on manual dispatch, on the weekly schedule, when a
  # release tag (v*) is pushed, or when the commit message contains "[device-qa]".
  device-qa:
    permissions:
      contents: read
      pull-requests: write
    # Same dual trigger as the screenshots job: the commit-message tag only exists on push
    # events, so the PR title is the reliable opt-in when the branch has an open PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[device-qa]')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, '[device-qa]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 21 everywhere: AGP 8.9 + this API 36 module. Bytecode still targets 17.
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The TFLite binaries are build inputs, not source: they are 7.5 MB of weights and
      # are fetched rather than committed. See FabricFit/docs/MODELS.md.
      - name: Fetch TFLite models
        run: bash tools/models/fetch_tflite_models.sh

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The rules file only grants permissions; it cannot conjure a device node on a host
          # without nested virtualisation. Say so here, in one line, instead of letting the
          # emulator fail to boot five steps later with an unrelated error.
          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm is absent on this runner, so an x86_64 emulator cannot boot accelerated (and booting unaccelerated takes ~40 minutes). Hosted runners normally provide it; if this recurs, run this job on a larger/self-hosted runner."
            exit 1
          fi
          echo "/dev/kvm present: $(ls -l /dev/kvm)"

      # A failed first boot is usually transient (download or disk contention on a shared
      # runner). One retry with an explicit cold boot turns most of those into a green run
      # without hiding a genuine test failure: a test assertion fails twice, a boot does not.
      - name: Boot check (retried once)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        continue-on-error: true
        id: boot
        with:
          api-level: 33
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: FabricFit
          script: adb shell getprop sys.boot_completed | grep -q 1

      # The whole instrumented suite, not a filtered subset. It used to hard-code a
      # -Pandroid...class filter for PersonSegmenterDeviceTest, so any other instrumented
      # test was silently skipped even on the runs that did execute - a passing device-qa
      # would never have run the database, launch or try-on tests.
      - name: Instrumented suite on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          SCREENSHOT_ABI: '1'
        with:
          api-level: 33
          target: default
          arch: x86_64
          # Explicit cold boot: no snapshot restore (the commonest cause of a half-booted
          # emulator that answers adb but fails every instrumentation), software GPU because
          # hosted runners have no GPU, and animations off so Compose idle detection is
          # reliable rather than timing out under transition animations.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: FabricFit
          # A wedged instrumentation hangs until the pre-installed runner's own timeout; cap
          # it so a failure reports in minutes with logs instead of burning the job budget.
          # This runner executes `script` with /bin/sh, so bash-only builtins (set -o
          # pipefail) exit 2 before gradle starts - which is exactly the failure that was
          # observed. The real logic lives in a bash script with a shebang, and the log is
          # tee'd to $RUNNER_TEMP because a later step re-publishes it: the raw job log needs
          # an Actions login, so failures were reported as "exit code 1" with nothing to read.
          script: >
            export SCREENSHOT_ABI=1 &&
            export INSTRUMENTATION_LOG="$RUNNER_TEMP/instrumentation.log" &&
            chmod +x ./gradlew tools/qa/run_instrumented.sh &&
            ./tools/qa/run_instrumented.sh

      # Keep the HTML report and the raw XML whether the suite passed or failed: the
      # annotation step only greps messages, and a device-only failure needs the full report.
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            FabricFit/app/build/outputs/androidTest-results
            FabricFit/app/build/reports/androidTests
          if-no-files-found: warn

      - name: Report the instrumentation failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG: ${{ runner.temp }}/instrumentation.log
        run: |
          set -u
          if [ -f "$LOG" ]; then
            echo "::group::last 200 lines of instrumentation.log"
            tail -200 "$LOG" || true
            echo "::endgroup::"
            # Annotations are the only channel that survives without an Actions login.
            python3 - "$LOG" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          lines = [l for l in text.splitlines() if l.strip()]
          # Prefer the per-test failures and the assertion text under them: the summary tail
          # ("BUILD FAILED") is always present and identifies nothing.
          test_lines = [i for i, l in enumerate(lines)
                        if l.rstrip().endswith("FAILED") and ">" in l]
          picked: list[str] = []
          for i in test_lines:
              picked.append(lines[i])
              picked.extend(lines[i + 1:i + 3])     # the exception + its message
          if not picked:
              picked = [l for l in lines if any(k in l.lower() for k in
                        ("exception", "assertion", "error", "emulator", "boot"))]
          for line in (picked or lines)[-10:]:
              clean = line.replace("%", "%25").replace("\r", "").replace("\n", "")
              print(f"::error::{clean[:900]}")
          PY
            # A PR comment is readable from the API, so the failure can be diagnosed without
            # the log archive; keep it short and collapsed to avoid burying the PR.
            target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
            if [ -n "$target_branch" ]; then
              {
                echo '### device-qa failed'
                echo
                echo "<details><summary>instrumentation.log (tail)</summary>"
                echo
                echo '```'
                tail -120 "$LOG" || true
                echo '```'
                echo
                echo '</details>'
              } > "$RUNNER_TEMP/comment.md"
              gh pr comment "$target_branch" --body-file "$RUNNER_TEMP/comment.md" \
                || echo "::warning::could not post the failure comment"
            fi
          else
            echo "::error::No instrumentation.log was produced, so gradle never started: the emulator most likely failed to boot. Check the emulator-runner step above."
          fi

      - name: Annotate instrumented test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          # This step runs in the job working-directory (FabricFit), not the workspace root.
          root = pathlib.Path("app/build/outputs/androidTest-results")
          if not root.exists():
              print(f"::error title=No test results::No instrumented results under {pathlib.Path.cwd() / root}. Gradle did not get as far as running a test - check the instrumentation log above.")
              raise SystemExit(0)
          found = False
          for xml in root.rglob("*.xml"):
              tree = ET.parse(xml)
              for tc in tree.iter("testcase"):
                  for f in list(tc.findall("failure")) + list(tc.findall("error")):
                      found = True
                      msg = (f.text or f.attrib.get("message", "")).strip()
                      esc = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error::{tc.attrib.get('classname')}.{tc.attrib.get('name')}: {esc[:1400]}")
          if not found:
              print("::error title=No failures in the XML::Instrumentation reported failure but no test result contains one - the failure is in the runner or the app crashed at launch.")
          PY

  # On-demand end-to-end try-on on a real Android emulator: runs the bundled Ghanaian
  # model + kente swatch through the shipping pipeline and publishes the images.
  # Trigger: manual dispatch, or any push whose commit message contains "[tryon-e2e]".
  tryon-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[tryon-e2e]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The job commits the emulator-rendered look back to the branch it ran on.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      # JDK 21 everywhere: AGP 8.9 + this API 36 module. Bytecode still targets 17.
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The TFLite binaries are build inputs, not source: they are 7.5 MB of weights and
      # are fetched rather than committed. See FabricFit/docs/MODELS.md.
      - name: Fetch TFLite models
        run: bash tools/models/fetch_tflite_models.sh

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try-on E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          SCREENSHOT_ABI: '1'
        with:
          api-level: 33
          target: default
          arch: x86_64
          working-directory: FabricFit
          # The action runs each line of `script` as its own command, so the whole run
          # lives in a script: Gradle invocation, log capture and artifact pull.
          script: |
            bash ../tools/qa/run_tryon_e2e.sh

      # Test XML and logcat live behind blob storage that some clients cannot read;
      # annotations are always visible, so republish the failure reason as annotations.
      - name: Annotate the try-on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          found = False
          for xml in pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              for tc in ET.parse(xml).iter("testcase"):
                  for f in list(tc.findall("failure")) + list(tc.findall("error")):
                      found = True
                      name = f"{tc.attrib.get('classname')}.{tc.attrib.get('name')}"
                      lines = [l.strip() for l in (f.text or "").splitlines() if l.strip()]
                      print(f"::error title=E2E FAILED::{name} :: {' | '.join(lines[:6])[:1200]}")
          if not found:
              print("::error title=E2E FAILED::no androidTest XML produced - the build or the "
                    "emulator failed before the test ran; the gradle log tail follows")
              # Anything that looks like a failure in the captured Gradle log is the
              # next best evidence once the XML is missing.
              log = pathlib.Path("qa-artifacts/vton/gradle-e2e.log")
              if log.exists():
                  lines = [l.rstrip() for l in log.read_text(errors="replace").splitlines() if l.strip()]
                  signal = [
                      l for l in lines
                      if any(k in l for k in ("FAILED", "Exception", "Caused by", "error:",
                                              "Tests on", "Unable", "No connected", "BUILD"))
                  ]
                  print("::error title=E2E gradle log::" + " | ".join((signal or lines)[-16:])[:1500])
          PY
          # A device-side crash leaves logcat as the only evidence. The emulator action has
          # already shut the device down by now, so never block on adb: give it 20 seconds.
          timeout 20 adb logcat -d -t 400 2>/dev/null \
            | grep -iE "fabricfit|vton|OutOfMemory|FATAL" | tail -40 || true

      - name: Publish try-on images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-tryon-e2e
          # `with:` paths are repo-relative; the runner script writes to the repo root.
          path: |
            qa-artifacts/vton/*.jpg
            qa-artifacts/vton/*.png
            qa-artifacts/vton/report.txt
            qa-artifacts/vton/geometry.txt
            qa-artifacts/vton/gradle-e2e.log
          if-no-files-found: warn

      # Actions artifacts need a login to download and expire; the phone-rendered look is
      # evidence, so a passing run commits it to the branch like the screenshots job does.
      - name: Report what the device produced
        if: always()
        run: |
          # defaults.run.working-directory is FabricFit, so a relative qa-artifacts/... would
          # mean FabricFit/qa-artifacts; the runner script writes to the repo root.
          dir="$GITHUB_WORKSPACE/qa-artifacts/vton"
          ls -la "$dir" || true
          for f in "$dir"/*.jpg "$dir"/*.png; do
            if [ -f "$f" ]; then
              echo "::notice title=DEVICE ARTIFACT::$(basename "$f") $(stat -c%s "$f") bytes"
            fi
          done
          if [ -f "$dir/report.txt" ]; then
            echo "::notice title=DEVICE REPORT::$(tr '\n' ' ' < "$dir/report.txt" | head -c 900)"
          fi

      - name: Commit the device images to the branch
        if: success()
        run: |
          set -e
          # Every git command must run at the repo root: the job's working-directory is
          # FabricFit, where `git add FabricFit/...` matches nothing and exits 128.
          cd "$GITHUB_WORKSPACE"
          dir="$GITHUB_WORKSPACE/qa-artifacts/vton"
          dest="$GITHUB_WORKSPACE/FabricFit/docs/vton/device"
          mkdir -p "$dest"
          found=0
          for f in "$dir"/*.jpg "$dir"/*.png "$dir"/report.txt "$dir"/geometry.txt; do
            # `[ -f ] && cp && found=1` would stop the chain at the first glob that does
            # not match, so `found` would never be set. Use a real branch.
            if [ -f "$f" ]; then
              cp "$f" "$dest/"
              found=1
            fi
          done
          if [ "$found" = "0" ]; then
            echo "::warning title=No device images::nothing was pulled from the emulator"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FabricFit/docs/vton/device
          if git diff --cached --quiet; then
            echo "device images unchanged since the last run"
            exit 0
          fi
          git commit -m "ci: try-on rendered on an Android emulator [skip ci]"
          # The checkout is detached at the triggering SHA; push explicitly onto the
          # branch that triggered the run, and never let a failed push fail the job.
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:refs/heads/${branch}" \
            || echo "::warning title=Device images not pushed::git push was rejected; the artifact still has them"

  # Full app UI screenshots are expensive; capture them on demand only:
  # manual dispatch, or a push whose commit message contains "[screenshots]".
  # The job commits the refreshed PNGs back to the branch that triggered it.
  screenshots:
    # Trigger: manual dispatch, or a push whose message carries [screenshots], or the same tag
    # in the PR title. The PR-title route exists because a branch with an open PR emits two
    # runs (push and pull_request) and `github.event.head_commit` is only populated on the
    # former, so a commit-message tag appears to work or not depending on which run you look
    # at. Remove the tag from the title afterwards: it stays true for every later push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[screenshots]')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, '[screenshots]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    # The emulator on the hosted runner dies mid-capture intermittently ("device offline",
    # then "device not found" with no emulator left to retry against). The capture script
    # emits ::error:: annotations for every failure, so a broken *script* still shows up
    # loudly; this only stops an emulator crash from painting the whole run red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # JDK 21 everywhere: AGP 8.9 + this API 36 module. Bytecode still targets 17.
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The TFLite binaries are build inputs, not source: they are 7.5 MB of weights and
      # are fetched rather than committed. See FabricFit/docs/MODELS.md.
      - name: Fetch TFLite models
        run: bash tools/models/fetch_tflite_models.sh

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK with emulator native libraries
        env:
          SCREENSHOT_ABI: '1'
        run: ./gradlew :app:assembleDebug

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve installed Android command-line tools
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk_manager"
          tools_dir=$(dirname "$(dirname "$sdk_manager")")
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$tools_dir" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 33 emulator system image
        run: sdkmanager --install 'system-images;android-33;google_apis;x86_64' --channel=3

      - name: Capture current FabricFit app screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # No `-camera-back none`: the Create tab shows a live preview, and the
          # emulator's virtual camera at least renders a test pattern.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: FabricFit
          # NOTE: the runner's `script` input executes one command per line
          # (comments are dropped, lines are split), so all retry logic lives
          # in tools/qa/capture_with_retry.sh.
          script: |
            bash ../tools/qa/capture_with_retry.sh

      - name: Upload real app UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-readme-screens
          path: |
            qa-artifacts/screens/
            qa-artifacts/screens/play/
          if-no-files-found: warn

      - name: Commit refreshed screenshots to branch
        # Pushing back from a workflow token fails on protected branches. The captures are
        # uploaded as an artifact regardless, so a push failure here must not fail the job
        # - but it must say so loudly instead of swallowing the reason.
        run: |
          cp ../qa-artifacts/screens/*.png docs/screenshots/ || {
            echo "::error title=SCREENSHOTS::no captures produced under qa-artifacts/screens"
            exit 1
          }
          # The Play listing is regenerated from the same captures. Copies are made by
          # capture_fabricfit_screens.sh, which is the only thing that knows which screen
          # belongs in which listing slot.
          play_dir="../qa-artifacts/screens/play"
          if [ -d "$play_dir" ] && [ -n "$(ls -A "$play_dir" 2>/dev/null)" ]; then
            cp "$play_dir"/*.png store/screenshots/
          else
            echo "::warning title=PLAY SCREENSHOTS::no Play slots were produced; store/screenshots/ left untouched"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ store/screenshots/
          if git diff --cached --quiet; then
            echo "Screenshots unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "ci: refresh README and Play screenshots [skip ci]"
          # The checkout is detached at the triggering SHA, so a bare `git push` has no
          # upstream and always failed: these captures could never land, only be uploaded
          # as an artifact. Push explicitly onto the branch that triggered the run.
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git push origin "HEAD:refs/heads/${branch}" 2>push.log; then
            echo "Pushed refreshed screenshots to ${branch}."
          else
            echo "::warning title=SCREENSHOTS NOT PUSHED::$(tr '\n' ' ' < push.log | head -c 800)"
            echo "Captures are still attached to this run as the 'fabricfit-readme-screens' artifact."
          fi
