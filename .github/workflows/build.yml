name: Android build and real app journey

on:
  push:
    branches: [main, arena/5b96a1cd-ntoma-studio]
    paths: ['NtomaStudio/**', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NtomaStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and installable debug APK
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-unit-reports
          path: |
            NtomaStudio/app/build/outputs/apk/debug/*.apk
            NtomaStudio/app/build/outputs/apk/androidTest/debug/*.apk
            NtomaStudio/app/build/reports/tests/
            NtomaStudio/app/build/test-results/

  app-journey:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: NtomaStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run real app on Android 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: NtomaStudio
          script: bash tools/qa/run-emulator-journey.sh
      - name: Create store assets only after journey passes
        run: |
          python -m pip install Pillow==11.3.0
          python tools/qa/make-store-assets.py qa-artifacts qa-artifacts/store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-journey
          path: |
            NtomaStudio/qa-artifacts/
            NtomaStudio/app/build/reports/androidTests/
            NtomaStudio/app/build/outputs/androidTest-results/
