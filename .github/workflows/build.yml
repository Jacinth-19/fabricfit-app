name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly emulator sweep. Linux GitHub runners have no KVM, so the heavy
  # device-QA job runs on macOS; a schedule keeps it exercised without anyone
  # remembering to click "Run workflow".
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The Android module lives in FabricFit/; every run step starts there.
defaults:
  run:
    working-directory: FabricFit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The wrapper is committed without the executable bit, so make it runnable.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # assembleDebugAndroidTest compiles the instrumented source set, so a
      # package/class rename there is caught without needing an emulator.
      - name: Unit tests, debug build, instrumented-test compile
        run: >-
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: FabricFit/app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-debug-apk
          path: FabricFit/app/build/outputs/apk/debug/app-debug.apk

  # R8 exists to break code that reflection reaches at runtime, so the minified
  # release build is compiled on every push too — not just at release time.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Signed with the throwaway demo key committed in app/demo-release.keystore.
      - name: Minified release APK + Play bundle
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain 2>&1 \
            | tee release-gradle.log

      - name: Annotate the Gradle failure
        if: failure()
        run: python3 ../tools/qa/gradle_error_annotations.py release-gradle.log

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-apk
          path: FabricFit/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-aab
          path: FabricFit/app/build/outputs/bundle/release/app-release.aab

      # Artifacts expire and need an Actions login to download, so the release
      # build is also attached to a GitHub Release for one-click install.
      - name: Publish release APK + bundle to GitHub Releases
        if: >-
          success() && (github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          tag="v${version:-1.0.0}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/fabricfit-${tag}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/fabricfit-${tag}.aab"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "FabricFit ${tag}" \
              --notes "Signed release build produced by GitHub Actions run ${GITHUB_RUN_ID}."
          fi
          echo "Published $tag"

  # Opt-in device QA: run the DeepLabV3 instrumented test on an emulator.
  # macOS runners only (Linux GH runners lack KVM). Fires on manual dispatch,
  # on the weekly schedule, and when a release tag (v*) is pushed.
  device-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: DeepLabV3 person-segmentation QA on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          working-directory: FabricFit
          script: >
            chmod +x ./gradlew &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.fabricfit.app.data.ml.PersonSegmenterDeviceTest

  # Full app UI screenshots are expensive; capture them only when requested
  # manually via workflow_dispatch. The job commits the refreshed PNGs back
  # to the branch that triggered the dispatch.
  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK with emulator native libraries
        env:
          SCREENSHOT_ABI: '1'
        run: ./gradlew :app:assembleDebug

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve installed Android command-line tools
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk_manager"
          tools_dir=$(dirname "$(dirname "$sdk_manager")")
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$tools_dir" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 33 emulator system image
        run: sdkmanager --install 'system-images;android-33;google_apis;x86_64' --channel=3

      - name: Capture current FabricFit app screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: FabricFit
          # NOTE: the runner's `script` input executes one command per line
          # (comments are dropped, lines are split), so all retry logic lives
          # in tools/qa/capture_with_retry.sh.
          script: |
            bash ../tools/qa/capture_with_retry.sh

      - name: Upload real app UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-readme-screens
          path: qa-artifacts/screens/
          if-no-files-found: warn

      - name: Commit refreshed screenshots to branch
        run: |
          set -e
          cp ../qa-artifacts/screens/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh README screenshots [skip ci]"
            git push
          else
            echo "Screenshots unchanged, nothing to commit."
          fi
