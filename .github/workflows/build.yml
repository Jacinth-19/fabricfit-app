name: Android build and real app journey

on:
  push:
    branches: [main, arena/5b96a1cd-ntoma-studio]
    paths: ['NtomaStudio/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NtomaStudio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate localization and release tooling
        run: |
          python tools/localization/check_strings.py
          python -m unittest discover -s tools/localization -p 'test_*.py'
          python -m unittest discover -s tools/release -p 'test_*.py'
      - name: Unit tests and installable debug APK
        run: |
          set -o pipefail
          bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleReleaseCheck :app:bundleReleaseCheck --stacktrace 2>&1 | tee build-diagnostics.txt
      - name: Production signing must fail closed without credentials
        run: |
          if bash gradlew :app:preReleaseBuild > signing-gate.txt 2>&1; then
            echo "ERROR: unsigned production build was allowed"; exit 1
          fi
          grep -q 'Production release signing is missing' signing-gate.txt
      - name: Check 16 KB native and APK alignment
        run: |
          set -o pipefail
          python tools/qa/check-native-alignment.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/releaseCheck/app-releaseCheck.apk app/build/outputs/bundle/releaseCheck/app-releaseCheck.aab 2>&1 | tee native-alignment.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/releaseCheck/app-releaseCheck.apk 2>&1 | tee -a native-alignment.txt
      - name: Keep tested debug APK for a download release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ntoma-debug-apk
          retention-days: 30
          path: NtomaStudio/app/build/outputs/apk/debug/app-debug.apk

      - name: Accessible build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYDIAG'
          import json, os
          from pathlib import Path
          text = Path('build-diagnostics.txt').read_text() if Path('build-diagnostics.txt').exists() else 'Failure before compilation; inspect job setup.'
          for log in ['native-alignment.txt', 'signing-gate.txt']:
              if Path(log).exists(): text += '\n' + Path(log).read_text()[-15000:]
          Path('check.json').write_text(json.dumps({'name':'Build diagnostics', 'head_sha':os.environ['GITHUB_SHA'], 'status':'completed', 'conclusion':'failure', 'output':{'title':'Build failure', 'summary':'Compiler/test diagnostics', 'text':text[-60000:]}}))
          PYDIAG
          gh api repos/${{ github.repository }}/check-runs --input check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-unit-reports
          path: |
            NtomaStudio/app/build/outputs/apk/debug/*.apk
            NtomaStudio/app/build/outputs/apk/androidTest/debug/*.apk
            NtomaStudio/app/build/outputs/apk/releaseCheck/*.apk
            NtomaStudio/app/build/outputs/bundle/releaseCheck/*.aab
            NtomaStudio/app/build/outputs/mapping/releaseCheck/
            NtomaStudio/native-alignment.txt
            NtomaStudio/signing-gate.txt
            NtomaStudio/app/build/reports/tests/
            NtomaStudio/app/build/test-results/

  app-journey:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 33
            target: google_apis
          - api: 36
            target: google_apis_ps16k
    timeout-minutes: 35
    defaults:
      run:
        working-directory: NtomaStudio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-and-unit-reports
          path: NtomaStudio/ci-build
      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Resolve installed Android command-line tools
        run: |
          # Hosted runners may have a versioned directory without the 'latest' alias.
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk_manager"
          tools_dir=$(dirname "$(dirname "$sdk_manager")")
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$tools_dir" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Preflight system image installation with accessible diagnostics
        run: |
          mkdir -p qa-artifacts
          set -o pipefail
          sdkmanager --install 'system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64' --channel=3 2>&1 | tee qa-artifacts/sdk-setup.txt
      - name: Install and run real app on Android ${{ matrix.api }}
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: NtomaStudio
          script: EXPECTED_PAGE_SIZE=${{ matrix.api == 36 && '16384' || '4096' }} bash tools/qa/run-emulator-journey.sh
      - name: Accessible emulator diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYDIAG'
          import json, os
          from pathlib import Path
          files = list(Path('app/build/outputs/androidTest-results').rglob('*.xml'))
          text = '\n'.join(p.read_text() for p in files)
          log = Path('qa-artifacts/device-diagnostics.txt')
          text += log.read_text()[-20000:] if log.exists() else 'Emulator setup failed before tests.'
          text += '\n'.join(p.read_text() for p in Path('qa-artifacts').glob('*ui.xml'))
          setup = Path('qa-artifacts/sdk-setup.txt')
          if setup.exists(): text += '\n' + setup.read_text()[-18000:]
          Path('check.json').write_text(json.dumps({'name':'Emulator diagnostics', 'head_sha':os.environ['GITHUB_SHA'], 'status':'completed', 'conclusion':'failure', 'output':{'title':'App journey failure', 'summary':'Device test diagnostics', 'text':text[:60000]}}))
          PYDIAG
          gh api repos/${{ github.repository }}/check-runs --input check.json
      - name: Create store assets only after journey passes
        run: |
          python -m pip install Pillow==11.3.0
          python tools/qa/make-store-assets.py qa-artifacts qa-artifacts/store
      - name: Make captured deliverables accessible via GitHub API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/export-captures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-journey-${{ matrix.api }}
          path: |
            NtomaStudio/qa-artifacts/
            NtomaStudio/app/build/reports/androidTests/
            NtomaStudio/app/build/outputs/androidTest-results/

  publish-debug-apk:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/5b96a1cd-ntoma-studio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ntoma-debug-apk
          path: dist
      - name: Publish or refresh the debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag must not change, or the asset URL breaks for existing testers.
          if gh release view debug-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload debug-latest dist/app-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create debug-latest dist/app-debug.apk               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Ntoma Studio — debug test build"               --prerelease               --notes-file NtomaStudio/docs/DEBUG_RELEASE_NOTES.md
          fi
