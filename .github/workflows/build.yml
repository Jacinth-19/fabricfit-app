name: build

on:
  push:
    branches: [main, 'arena/d512fe2b-fabricfit-app']
    tags: ['v*']
  pull_request:
  # Weekly emulator sweep. Linux GitHub runners have no KVM, so the heavy
  # device-QA job runs on macOS; a schedule keeps it exercised without anyone
  # remembering to click "Run workflow".
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The Android module lives in FabricFit/; every run step starts there.
defaults:
  run:
    working-directory: FabricFit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The wrapper is committed without the executable bit, so make it runnable.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # assembleDebugAndroidTest compiles the instrumented source set, so a
      # package/class rename there is caught without needing an emulator.
      - name: Unit tests, debug build, instrumented-test compile
        run: >-
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: FabricFit/app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-debug-apk
          path: FabricFit/app/build/outputs/apk/debug/app-debug.apk

  # R8 exists to break code that reflection reaches at runtime, so the minified
  # release build is compiled on every push too — not just at release time.
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Signed with the throwaway demo key committed in app/demo-release.keystore.
      - name: Minified release APK + Play bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-apk
          path: FabricFit/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-aab
          path: FabricFit/app/build/outputs/bundle/release/app-release.aab

  # Opt-in device QA: run the DeepLabV3 instrumented test on an emulator.
  # macOS runners only (Linux GH runners lack KVM). Fires on manual dispatch,
  # on the weekly schedule, and when a release tag (v*) is pushed.
  device-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: DeepLabV3 person-segmentation QA on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          working-directory: FabricFit
          script: >
            chmod +x ./gradlew &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.fabricfit.app.data.ml.PersonSegmenterDeviceTest

  # Full app UI screenshots are expensive; capture them only when requested
  # manually or on pushes to the arena screenshot-refresh branch.
  # The reviewed PNGs are committed under FabricFit/docs/screenshots/ for the README.
  screenshots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/arena/d512fe2b-fabricfit-app' &&
       github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK with emulator native libraries
        env:
          SCREENSHOT_ABI: '1'
        run: ./gradlew :app:assembleDebug

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve installed Android command-line tools
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk_manager"
          tools_dir=$(dirname "$(dirname "$sdk_manager")")
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$tools_dir" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 33 emulator system image
        run: sdkmanager --install 'system-images;android-33;google_apis;x86_64' --channel=3

      - name: Capture current FabricFit app screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: FabricFit
          # NOTE: the runner's `script` input executes one command per line
          # (comments are dropped, lines are split), so all retry logic lives
          # in tools/qa/capture_with_retry.sh.
          script: |
            bash ../tools/qa/capture_with_retry.sh

      - name: Upload real app UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-readme-screens
          path: qa-artifacts/screens/
          if-no-files-found: warn

      # Export captured screenshots as base64 check-run annotations so they can
      # be retrieved via the Checks API (artifact blob storage is unreachable
      # from the dev sandbox, and the workflow token is read-only for pushes).
      # Protocol: SCREENSYNC|<file>|HDR|<total-base64-chars>
      #           SCREENSYNC|<file>|<chunk-index>|<base64-data>
      # Revert this step (and the branch trigger) once the screenshots land.
      - name: Encode screenshots into check-run annotations
        if: github.event_name == 'push' && always()
        run: |
          set -e
          cd ../qa-artifacts/screens
          # Install ImageMagick for resize (not preinstalled on ubuntu-latest).
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick >/dev/null
          fi
          magick_bin=$(command -v magick || command -v convert)
          mkdir -p /tmp/ss
          for f in home.png discover.png create.png favourites.png profile.png my-fit-closet.png; do
            test -f "$f" || continue
            if [ -n "$magick_bin" ]; then
              "$magick_bin" "$f" -resize 480x -strip "/tmp/ss/$f"
            else
              cp "$f" "/tmp/ss/$f"
            fi
            b64=$(base64 -w0 "/tmp/ss/$f")
            echo "syncing $f: raw=$(stat -c%s "/tmp/ss/$f") b64_chars=${#b64}"
            echo "::notice::SCREENSYNC|${f}|HDR|${#b64}"
            n=0
            while [ ${#b64} -gt 0 ]; do
              chunk=${b64:0:60000}
              b64=${b64:60000}
              echo "::notice::SCREENSYNC|${f}|${n}|${chunk}"
              n=$((n+1))
            done
          done
          echo "export done: all 6 screens encoded"

      - name: Commit refreshed screenshots to branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          cp ../qa-artifacts/screens/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh README screenshots [skip ci]"
            git push
          else
            echo "Screenshots unchanged, nothing to commit."
          fi
