name: build

on:
  push:
    branches: [main, 'arena/85eef50b-fabricfit-app']
    tags: ['v*']
  pull_request:
  # Weekly emulator sweep. Linux GitHub runners have no KVM, so the heavy
  # device-QA job runs on macOS; a schedule keeps it exercised without anyone
  # remembering to click "Run workflow".
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The Android module lives in FabricFit/; every run step starts there.
defaults:
  run:
    working-directory: FabricFit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The wrapper is committed without the executable bit, so make it runnable.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # assembleDebugAndroidTest compiles the instrumented source set, so a
      # package/class rename there is caught without needing an emulator.
      - name: Unit tests, debug build, instrumented-test compile
        run: |
          status=0
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest > build.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the failure as check-run annotations so it is readable via the
            # Checks API when raw logs are unavailable.
            hits=$(grep -E "^e: |error: |FAILED|What went wrong|Execution failed|Cannot resolve|Unresolved reference|unresolved" build.log | head -25 || true)
            if [ -n "$hits" ]; then
              echo "$hits" | while IFS= read -r line; do
                echo "::error title=gradle::$line"
              done
            else
              tail -n 25 build.log | while IFS= read -r line; do
                echo "::error title=gradle-tail::$line"
              done
            fi
            tail -n 30 build.log || true
          fi
          exit "$status"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: FabricFit/app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-debug-apk
          path: FabricFit/app/build/outputs/apk/debug/app-debug.apk

  # R8 exists to break code that reflection reaches at runtime, so the minified
  # release build is compiled on every push too — not just at release time.
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Signed with the throwaway demo key committed in app/demo-release.keystore.
      - name: Minified release APK + Play bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-apk
          path: FabricFit/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-aab
          path: FabricFit/app/build/outputs/bundle/release/app-release.aab

  # Opt-in device QA: run the DeepLabV3 instrumented test on an emulator.
  # macOS runners only (Linux GH runners lack KVM). Fires on manual dispatch,
  # on the weekly schedule, and when a release tag (v*) is pushed.
  device-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: DeepLabV3 person-segmentation QA on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          working-directory: FabricFit
          script: >
            chmod +x ./gradlew &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.fabricfit.app.data.ml.PersonSegmenterDeviceTest

  # Full app UI screenshots are expensive; capture them only when requested manually
  # (or on pushes to the arena UI-refresh branch, which is re-capturing its README art).
  # The reviewed PNGs can be committed under FabricFit/docs/screenshots/ for the README.
  screenshots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/arena/85eef50b-fabricfit-app')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK with emulator native libraries
        env:
          SCREENSHOT_ABI: '1'
        run: ./gradlew :app:assembleDebug

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve installed Android command-line tools
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk_manager"
          tools_dir=$(dirname "$(dirname "$sdk_manager")")
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$tools_dir" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 33 emulator system image
        run: sdkmanager --install 'system-images;android-33;google_apis;x86_64' --channel=3

      - name: Capture current FabricFit app screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: FabricFit
          script: |
            bash ../tools/qa/capture_fabricfit_screens.sh ../qa-artifacts/screens
            test -s ../qa-artifacts/screens/home.png

      - name: Upload real app UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-readme-screens
          path: qa-artifacts/screens/
          if-no-files-found: warn

      # TEMPORARY (arena session): artifact host is unreachable from the dev sandbox,
      # so CI also mirrors the captured PNGs to a helper branch for retrieval.
      # Revert this step (and the push-branch trigger) after the screenshots land.
      - name: Sync screenshots to arena/screens-sync
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sync_log=/tmp/sync.log
          status=0
          {
            mkdir -p docs/screenshots
            cp ../qa-artifacts/screens/*.png docs/screenshots/
            git config user.name "arena-ci-sync"
            git config user.email "arena-ci-sync@users.noreply.github.com"
            git remote -v
            git add docs/screenshots
            if git diff --cached --quiet; then
              echo "screenshots unchanged - skip push"
            else
              git commit -m "chore(ci): refresh README screenshots from emulator capture"
              git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/arena/screens-sync --force
            fi
          } > "$sync_log" 2>&1 || status=$?
          tail -n 25 "$sync_log"
          if [ "$status" -ne 0 ]; then
            tail -n 15 "$sync_log" | while IFS= read -r line; do
              echo "::error title=screens-sync::$line"
            done
          fi
          exit "$status"
