name: build

on:
  push:
    # Feature branches are built too, so a branch can be validated (and have its
    # screenshots refreshed) without opening a pull request first.
    branches: [main, "arena/**"]
    tags: ['v*']
  pull_request:
  # Weekly emulator sweep on Linux with KVM acceleration; a schedule keeps
  # device-qa exercised without anyone remembering to click "Run workflow".
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The Android module lives in FabricFit/; every run step starts there.
defaults:
  run:
    working-directory: FabricFit

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The wrapper is committed without the executable bit, so make it runnable.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # assembleDebugAndroidTest compiles the instrumented source set, so a
      # package/class rename there is caught without needing an emulator.
      - name: Unit tests, debug build, instrumented-test compile
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            :app:assembleDebugAndroidTest --console=plain 2>&1 | tee verify-gradle.log

      # Job logs need a login to read; annotations are visible on the public run
      # page, so the reason for a red build is obvious without opening the log.
      - name: Annotate the Gradle failure
        if: failure()
        run: python3 ../tools/qa/gradle_error_annotations.py verify-gradle.log

      # Annotations are truncated, so the full error list also goes to the pull
      # request (or the branch's PR), where it can be read line by line.
      - name: Report the failure on the pull request
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number \
               --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request for ${GITHUB_REF_NAME}; skipping comment."
            exit 0
          fi
          {
            echo "### ❌ Gradle: \`verify\` failed on \`${GITHUB_REF_NAME}\`"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            python3 ../tools/qa/gradle_error_annotations.py verify-gradle.log --markdown
          } > /tmp/gradle-failure.md
          # Update the previous failure comment instead of spamming the PR.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
            --jq '[.[] | select(.body | startswith("### ❌ Gradle:"))] | last | .id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@/tmp/gradle-failure.md > /dev/null
          else
            gh pr comment "$pr" --body-file /tmp/gradle-failure.md
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: FabricFit/app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-debug-apk
          path: FabricFit/app/build/outputs/apk/debug/app-debug.apk

  # R8 exists to break code that reflection reaches at runtime, so the minified
  # release build is compiled on every push too — not just at release time.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Decode an upload keystore when configured. Demo signing remains useful
      # for disposable tester APKs, but repository variable PRODUCTION_RELEASE=true
      # makes every missing production signing secret a hard failure.
      - name: Decode and validate release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PRODUCTION_RELEASE: ${{ vars.PRODUCTION_RELEASE }}
        run: |
          if [ "$PRODUCTION_RELEASE" = "true" ]; then
            missing=0
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::PRODUCTION_RELEASE requires the $name secret."
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "::error::Refusing to create a production artifact with demo-release.keystore."
              exit 1
            fi
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload.keystore
            echo "KEYSTORE_FILE=upload.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING=production" >> "$GITHUB_ENV"
          else
            echo "::warning::Using the public demo keystore. Do not upload this artifact to Google Play."
            echo "RELEASE_SIGNING=demo" >> "$GITHUB_ENV"
          fi

      - name: Minified release APK + Play bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain 2>&1 \
            | tee release-gradle.log

      - name: Annotate the Gradle failure
        if: failure()
        run: python3 ../tools/qa/gradle_error_annotations.py release-gradle.log

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-apk
          path: FabricFit/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-release-aab
          path: FabricFit/app/build/outputs/bundle/release/app-release.aab

      # Artifacts expire and need an Actions login to download, so the release
      # build is also attached to a GitHub Release for one-click install.
      - name: Publish release APK + bundle to GitHub Releases
        if: >-
          success() && (github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' &&
           contains(github.event.head_commit.message, '[release]')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          tag="v${version:-1.0.0}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/fabricfit-${tag}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/fabricfit-${tag}.aab"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            # Pin a newly created tag to the exact revision compiled in this job.
            # Without --target, a manual release from a branch can tag the
            # repository's default branch while publishing branch-built assets.
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "FabricFit ${tag}" \
              --notes "${RELEASE_SIGNING} signed release build produced by GitHub Actions run ${GITHUB_RUN_ID} from commit ${GITHUB_SHA}. Demo-signed artifacts are for testing only and must not be uploaded to Google Play."
          fi
          echo "Published $tag"

  # Opt-in device QA: run the DeepLabV3 instrumented test on a KVM-accelerated
  # Linux emulator. Fires on manual dispatch, on the weekly schedule, when a
  # release tag (v*) is pushed, or when the commit message contains "[device-qa]".
  device-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[device-qa]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: DeepLabV3 person-segmentation QA on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          SCREENSHOT_ABI: '1'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: FabricFit
          script: >
            export SCREENSHOT_ABI=1 &&
            bash ../tools/qa/enable_three_button_navigation.sh &&
            chmod +x ./gradlew &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.fabricfit.app.data.ml.PersonSegmenterDeviceTest,com.fabricfit.app.ui.navigation.BottomNavigationInsetTest

      - name: Annotate instrumented test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for xml in pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              tree = ET.parse(xml)
              for tc in tree.iter("testcase"):
                  for f in list(tc.findall("failure")) + list(tc.findall("error")):
                      msg = (f.text or f.attrib.get("message", "")).strip()
                      esc = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error::{tc.attrib.get('classname')}.{tc.attrib.get('name')}: {esc[:1400]}")
          PY

  # Real-fabric QA is deliberately separate from pass/fail build verification:
  # search-derived online labels are unvetted, so recognition results are reported
  # honestly without turning a low accuracy finding into a misleading green quality gate.
  fabric-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[fabric-qa]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install LiteRT and image/scraper dependencies
        run: python3 -m pip install --disable-pip-version-check ai-edge-litert numpy pillow requests certifi

      - name: Verify dataset scraper safety rails
        run: python3 FabricFit/tools/dataset/scrape/selftest.py

      - name: Collect freely licensed real fabric photos online
        env:
          FABRICFIT_SCRAPER_CONTACT: https://github.com/Jacinth-19/fabricfit-app
        run: |
          rm -rf FabricFit/tools/dataset/scraped/wikimedia FabricFit/tools/dataset/scraped/openverse
          python3 FabricFit/tools/dataset/scrape/wikimedia.py \
            --per-class 2 --queries-per-class 4 --max-pages 2 --sleep 0.2
          python3 FabricFit/tools/dataset/scrape/openverse.py \
            --per-class 1 --queries-per-class 4 --max-pages 2 --sleep 0.2

      - name: Collect manually curated, openly licensed fabric examples
        env:
          FABRICFIT_SCRAPER_CONTACT: https://github.com/Jacinth-19/fabricfit-app
        run: |
          rm -rf FabricFit/tools/dataset/scraped/manifest
          python3 FabricFit/tools/dataset/scrape/manifest.py \
            FabricFit/tools/dataset/qa_real_fabrics.csv --sleep 0.2

      - name: Audit every bundled TFLite model
        run: python3 tools/qa/fabric_model_qa.py contracts --output qa-artifacts/model-contracts.json

      - name: Evaluate models on the unvetted online search set
        run: |
          python3 tools/qa/fabric_model_qa.py online \
            --data-dir FabricFit/tools/dataset/scraped/wikimedia \
            --data-dir FabricFit/tools/dataset/scraped/openverse \
            --contracts qa-artifacts/model-contracts.json \
            --output-dir qa-artifacts/online-search \
            --evaluation-type search --per-class 2

      - name: Evaluate models on curated real online fabrics
        run: |
          python3 tools/qa/fabric_model_qa.py online \
            --data-dir FabricFit/tools/dataset/scraped/manifest \
            --contracts qa-artifacts/model-contracts.json \
            --output-dir qa-artifacts/curated \
            --evaluation-type curated --per-class 1 --require-all-classes

      - name: Upload model and real-fabric QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-real-fabric-qa
          path: |
            qa-artifacts/
            FabricFit/tools/dataset/scraped/wikimedia/CREDITS.csv
            FabricFit/tools/dataset/scraped/openverse/CREDITS.csv
            FabricFit/tools/dataset/scraped/manifest/CREDITS.csv
          if-no-files-found: warn

      - name: Commit QA reports and attributed contact sheets
        if: always()
        run: |
          set -e
          if [ ! -f qa-artifacts/curated/real-fabric-report.json ]; then
            echo 'No curated online report was generated; nothing to commit.'
            exit 0
          fi
          mkdir -p FabricFit/docs/qa/online-search
          cp qa-artifacts/model-contracts.json qa-artifacts/model-contracts.md FabricFit/docs/qa/
          cp qa-artifacts/curated/real-fabric-report.json qa-artifacts/curated/real-fabric-report.md \
            qa-artifacts/curated/real-fabric-contact-sheet.jpg FabricFit/docs/qa/
          if [ -f qa-artifacts/online-search/real-fabric-report.json ]; then
            cp qa-artifacts/online-search/real-fabric-report.json \
              qa-artifacts/online-search/real-fabric-report.md \
              qa-artifacts/online-search/real-fabric-contact-sheet.jpg FabricFit/docs/qa/online-search/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FabricFit/docs/qa/
          if ! git diff --cached --quiet; then
            git commit -m "docs: test bundled models on real online fabrics [skip ci]"
            git push
          fi

  # Full app UI screenshots are expensive; capture them on demand only:
  # manual dispatch, or a push whose commit message contains "[screenshots]".
  # The job commits the refreshed PNGs back to the branch that triggered it.
  screenshots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[screenshots]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK with emulator native libraries
        env:
          SCREENSHOT_ABI: '1'
        run: ./gradlew :app:assembleDebug

      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve installed Android command-line tools
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk_manager"
          tools_dir=$(dirname "$(dirname "$sdk_manager")")
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$tools_dir" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 33 emulator system image
        run: sdkmanager --install 'system-images;android-33;google_apis;x86_64' --channel=3

      - name: Capture current FabricFit app screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # No `-camera-back none`: the Create tab shows a live preview, and the
          # emulator's virtual camera at least renders a test pattern.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: FabricFit
          # NOTE: the runner's `script` input executes one command per line
          # (comments are dropped, lines are split), so all retry logic lives
          # in tools/qa/capture_with_retry.sh.
          script: |
            bash ../tools/qa/capture_with_retry.sh

      - name: Upload real app UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabricfit-readme-screens
          path: qa-artifacts/screens/
          if-no-files-found: warn

      - name: Commit refreshed screenshots to branch
        run: |
          set -e
          cp ../qa-artifacts/screens/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh README screenshots [skip ci]"
            git push
          else
            echo "Screenshots unchanged, nothing to commit."
          fi
