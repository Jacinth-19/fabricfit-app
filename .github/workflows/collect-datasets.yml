name: Collect public fabric dataset candidates

on:
  push:
    branches: [arena/5b96a1cd-ntoma-studio]
    paths:
      - '.github/workflows/collect-datasets.yml'
      - 'NtomaStudio/tools/dataset/collect_public.py'
      - 'NtomaStudio/tools/dataset/collection_queries.json'
      - 'NtomaStudio/tools/dataset/release_collection_queries.json'
      - 'NtomaStudio/tools/dataset/known_source_ids.json'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: public-datasets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: commons
            task: pattern
            max_new: 900
            max_per_label: 150
          - source: commons
            task: family
            max_new: 1100
            max_per_label: 100
          - source: cma
            task: pattern
            max_new: 900
            max_per_label: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install requests==2.32.5 Pillow==12.3.0
      - name: Offline collection tests
        run: python -m unittest discover -s NtomaStudio/tools/dataset -p 'test_collect_public.py' -v
      - name: Collect review candidates, never training labels
        run: >-
          python NtomaStudio/tools/dataset/collect_public.py
          --out .datasets/public-${{ matrix.source }}-${{ matrix.task }}
          --sources ${{ matrix.source }} --task ${{ matrix.task }}
          --queries NtomaStudio/tools/dataset/release_collection_queries.json
          --known-ids NtomaStudio/tools/dataset/known_source_ids.json
          --per-query 150 --queries-per-label 4 --minutes 45
          --max-new ${{ matrix.max_new }} --max-per-label ${{ matrix.max_per_label }}
      - name: Preserve candidates and rights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-fabric-review-${{ matrix.source }}-${{ matrix.task }}
          path: .datasets/public-${{ matrix.source }}-${{ matrix.task }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Publish readable acquisition audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
          TASK: ${{ matrix.task }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, io, zipfile
          root = pathlib.Path('.datasets') / ('public-' + os.environ['SOURCE'] + '-' + os.environ['TASK'])
          report = root / 'report.json'
          text = (root / 'summary.md').read_text() if report.exists() else 'Collection failed before a report was saved.'
          if report.exists():
              data = json.loads(report.read_text())
              buffer = io.BytesIO()
              with zipfile.ZipFile(buffer, 'w', zipfile.ZIP_DEFLATED) as archive:
                  for name in ('report.json','summary.md','manifest.jsonl'):
                      archive.write(root / name, name)
                  # Small review images only. Full-sized candidates remain in the artifact.
                  from PIL import Image
                  for picture in sorted((root / 'images').glob('*.jpg')):
                      with Image.open(picture) as image:
                          image.thumbnail((320,320))
                          thumb = io.BytesIO()
                          image.save(thumb, format='JPEG', quality=75)
                          archive.writestr('review-thumbnails/' + picture.name, thumb.getvalue())
              blob_payload = json.dumps(dict(content=base64.b64encode(buffer.getvalue()).decode(), encoding='base64'))
              blob = subprocess.run(['gh','api','--method','POST','repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs','--input','-'],
                                    input=blob_payload, text=True, capture_output=True, check=True)
              sha = json.loads(blob.stdout)['sha']
              text += '\nReview metadata + small thumbnails git blob (not training images): `' + sha + '`\n'
              # Small result inventory makes review possible without downloading photos.
              inventory = []
              for line in (root / 'manifest.jsonl').read_text().splitlines():
                  row = json.loads(line)
                  if any(m['suggested_label'] in {'KENTE','KENTE_PRINT','ADINKRA','WAX','ANKARA','FUGU','GONJA'} for m in row['matches']):
                      inventory.append({k: row[k] for k in ('title','landing_page','license','matches')})
              text += '\n## Ghanaian-family search inventory\n```json\n' + json.dumps(inventory, ensure_ascii=False)[:26000] + '\n```\n'
              text += '\n## API/download errors (first 12)\n```json\n' + json.dumps(data['errors'][:12]) + '\n```\n'
          payload = dict(name='Dataset acquisition: ' + os.environ['SOURCE'] + '/' + os.environ['TASK'], head_sha=os.environ['GITHUB_SHA'],
                         status='completed', conclusion='success' if report.exists() and data['unique_images'] else 'failure',
                         output=dict(title='Candidate data only — not reviewed training labels', summary=text[:55000]))
          subprocess.run(['gh','api','--method','POST','repos/' + os.environ['GITHUB_REPOSITORY'] + '/check-runs','--input','-'],
                         input=json.dumps(payload), text=True, check=True, stdout=subprocess.DEVNULL)
          PY
