name: Signed production bundle (manual only)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused Play version code (must exceed the current code)'
        required: true
        type: string
      confirm_upload_key:
        description: 'I verified this upload certificate against Play Console (or this is a brand-new app)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  bundle:
    if: inputs.confirm_upload_key && github.ref == 'refs/heads/arena/5b96a1cd-ntoma-studio'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: NtomaStudio
    env:
      NTOMA_UPLOAD_STORE_PASSWORD: ${{ secrets.NTOMA_UPLOAD_STORE_PASSWORD }}
      NTOMA_UPLOAD_KEY_ALIAS: ${{ secrets.NTOMA_UPLOAD_KEY_ALIAS }}
      NTOMA_UPLOAD_KEY_PASSWORD: ${{ secrets.NTOMA_UPLOAD_KEY_PASSWORD }}
      NTOMA_UPLOAD_CERT_SHA256: ${{ vars.NTOMA_UPLOAD_CERT_SHA256 }}
      NTOMA_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Decode key privately and verify upload identity
        env:
          NTOMA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NTOMA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          code = os.environ['NTOMA_VERSION_CODE']
          if not code.isdecimal() or not 1 <= int(code) <= 2100000000:
              raise SystemExit('Invalid Play version code')
          source = os.environ.get('NTOMA_UPLOAD_KEYSTORE_BASE64', '')
          if not source:
              raise SystemExit('No production upload key configured; no release built')
          try:
              data = base64.b64decode(source, validate=True)
          except ValueError:
              raise SystemExit('Invalid keystore encoding')
          path = Path(os.environ['RUNNER_TEMP']) / 'ntoma-upload.keystore'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'NTOMA_UPLOAD_KEYSTORE={path}\n')
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as out:
              out.write(data)
          PY
          NTOMA_UPLOAD_KEYSTORE="$RUNNER_TEMP/ntoma-upload.keystore" python tools/release/verify_upload_key.py
      - name: Build and check signed production bundle
        run: |
          python tools/localization/check_strings.py
          bash gradlew :app:testDebugUnitTest :app:bundleRelease
          python tools/qa/check-native-alignment.py app/build/outputs/bundle/release/app-release.aab
          # Valid signature is required; self-signed upload certificate warnings are expected.
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/signature-check.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/signature-check.txt"
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ntoma-upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: production-bundle-${{ inputs.version_code }}
          retention-days: 14
          path: |
            NtomaStudio/app/build/outputs/bundle/release/*.aab
            NtomaStudio/app/build/outputs/mapping/release/mapping.txt
      # Deliberately no Play publishing or keystore artifact step.
